<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global Bushfire Activity</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>

<body>

  <h2>Global Bushfire Activity</h2>
  <p>
    This map shows global bushfire activity using fire detection points.
  </p>

  <div id="global_fire"></div>

  <script>
    vegaEmbed("#global_fire", "json/global_fire.json")
      .catch(error => console.error(error));
  </script>

  <h2>Top 20 Countries by Bushfire Activity</h2>
<p>
  This bar chart shows the top 20 countries with the highest number of high-confidence fire detections.
</p>

<div id="global_fire_by_country"></div>

<script>
  vegaEmbed("#global_fire_by_country", "json/global_fire_by_country.json");
</script>
</body>
</html>
