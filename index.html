<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Global Bushfire Activity</title>

  <!-- 引入 Vega / Vega-Lite / Vega-Embed -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

</head>

<body>

  <h2>Global Bushfire Activity</h2>
  <p>
    This map shows global bushfire activity using fire detection points.
    Each orange circle represents a recorded fire detection.
  </p>

  <!-- 图会出现在这里 -->
  <div id="global_bushfire_map"></div>

  <script>
    vegaEmbed("#global_bushfire_map", "json/global_bushfire.json");
  </script>

</body>
</html>
